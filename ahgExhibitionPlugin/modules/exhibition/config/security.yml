# Exhibition management is staff-facing: nothing in this module is public.
#
# Symfony's default is `is_secure: false`, so a module without this file answers
# every request from an anonymous visitor - including the write actions. This
# module had no security.yml at all: an anonymous GET of /index.php/exhibition returned the management screen
# with New Exhibition, Exhibition Dashboard and the statistics panel, and the
# module also exposes add, edit, delete, transition and reorder actions.
#
# Deliberately `is_secure` only, with no `credentials` key - a module-wide
# `credentials: [editor]` refuses administrators, who hold the administrator
# credential rather than editor. Actions needing more than "logged in" enforce
# it themselves. Same pattern as ahgSpectrumPlugin/modules/spectrum.
all:
  is_secure: true
