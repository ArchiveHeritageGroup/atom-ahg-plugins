name: Tests

# Pure-logic test suites. They require no database, no Symfony bootstrap, no
# composer install and no fixtures - each test file requires the class under test
# and nothing else. That is why they can run here at all: the decisions they cover
# were deliberately extracted as pure statics so they could be tested without the
# harness this repository does not have.
#
# Every runner exits non-zero on failure, so a broken assertion fails the build.

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PHP_VERSION: '8.3'

jobs:
  privacy:
    name: ahgPrivacyPlugin
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, json

      # Every suite under any plugin's tests/ directory. A glob rather than a
      # hardcoded list: the list version silently skipped a new suite the day it
      # was added, which is the failure this replaces. nullglob so an empty match
      # is not treated as a literal path, and `|| exit 1` so one failure fails the
      # build rather than being swallowed by the loop.
      - name: Plugin test suites
        run: |
          shopt -s nullglob
          found=0
          for t in ahg*Plugin/tests/*_test.php; do
            found=$((found + 1))
            echo "--- $t"
            php "$t" || exit 1
          done
          echo "ran $found suite(s)"
          # A glob that matches nothing must fail: it means the suites moved or the
          # naming changed, and a green build proving nothing is worse than a red one.
          if [ "$found" -eq 0 ]; then echo "no test suites matched - refusing to pass"; exit 1; fi
