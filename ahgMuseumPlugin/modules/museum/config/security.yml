# Museum cataloguing is staff-facing: nothing in this module is public.
#
# Symfony's default is `is_secure: false`, so a module without this file answers
# every request from an anonymous visitor - including the write actions. This
# module had no security.yml at all: add, edit and delete sit beside the dashboard and vocabulary screens, and
# only 3 of its 8 action files carried any check of their own.
#
# Deliberately `is_secure` only, with no `credentials` key - a module-wide
# `credentials: [editor]` refuses administrators, who hold the administrator
# credential rather than editor. Actions needing more than "logged in" enforce
# it themselves. Same pattern as ahgSpectrumPlugin/modules/spectrum.
# The record view is public: museum (CCO) records are published descriptions,
# and indexAction checks read access itself (QubitAcl 'read', which honours
# publication status, plus the embargo gate). Without this line every museum
# record sent visitors to the log-in page (found 19 Oct 2026, issue #210).
index:
  is_secure: false

all:
  is_secure: true
