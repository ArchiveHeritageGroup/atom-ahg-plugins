# SECURITY: administrators only - this module browses the audit log, which
# records who did what to which record across the whole instance.
#
# The module had no config/ directory at all, so it inherited
# apps/qubit/config/security.yml, whose `default: is_secure: false` made every
# action public. The actions do check (`auditActions::execute*` bounces
# non-administrators at modules/audit/actions/actions.class.php:10-13), but that
# is one imperative guard standing between an anonymous visitor and the audit
# trail. This states the posture declaratively as well.
#
# Double-bracket OR form: a single-item list requires literally that group and
# 403s administrators.
all:
  is_secure:   true
  credentials: [[ administrator ]]
