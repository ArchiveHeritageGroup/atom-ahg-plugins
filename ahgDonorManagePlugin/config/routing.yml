# Routes are loaded via prependRoute() — last entry in this file
# gets prepended last (checked first). Put catch-all /:slug FIRST
# so it ends up checked LAST after prepending.

# Same requirement as the PHP route of this name: prependRoute() keeps this
# definition's contents, so without it "dashboard" (ahgDonorAgreementPlugin's
# /donor/dashboard) was read as a donor slug on sites that load that plugin first.
donor_view_override:
  url: /donor/:slug
  param: { module: donorManage, action: view }
  requirements: { slug: '(?!dashboard(?:/|$))[^/]+' }

donor_delete_override:
  url: /donor/:slug/delete
  param: { module: donorManage, action: delete }

donor_edit_override:
  url: /donor/:slug/edit
  param: { module: donorManage, action: edit }

donor_add_override:
  url: /donor/add
  param: { module: donorManage, action: edit }

donor_browse_override:
  url: /donor/browse
  param: { module: donorManage, action: browse }
