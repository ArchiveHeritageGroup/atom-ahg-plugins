# The QubitResourceRoute entries here also exist in this plugin's PHP RouteLoader,
# but this file's definition is the one that runs, and it must stay: the
# actions read $this->getRoute()->resource, which only QubitResourceRoute sets.
term_edit_override:
  class: QubitResourceRoute
  url: /term/:slug/edit
  param: { module: termTaxonomy, action: edit }
  requirements: { slug: "[a-zA-Z0-9_-]+" }

term_delete_override:
  class: QubitResourceRoute
  url: /term/:slug/delete
  param: { module: termTaxonomy, action: delete }
  requirements: { slug: "[a-zA-Z0-9_-]+" }

term_related_authorities:
  class: QubitResourceRoute
  url: /term/:slug/related-authorities
  param: { module: termTaxonomy, action: relatedAuthorities }
  requirements: { slug: "[a-zA-Z0-9_-]+" }

term_add:
  url: /term/add
  class: AddActionRoute
  param: { module: term, action: edit }

term_browse_override:
  class: QubitResourceRoute
  url: /term/:slug
  param: { module: termTaxonomy, action: index }
  requirements: { slug: "(?!add$)[a-zA-Z0-9_-]+" }

taxonomy_skos_export:
  url: /taxonomy/:id/skos
  param: { module: termTaxonomy, action: exportSkos }
  requirements: { id: \d+ }
