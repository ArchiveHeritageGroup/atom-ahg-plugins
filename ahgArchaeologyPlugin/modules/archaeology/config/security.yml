# Archaeology module access.
#
# A missing modules/<name>/config/security.yml inherits `default: is_secure: false`
# from apps/qubit/config/security.yml - it fails OPEN. This file must exist.
#
# Double-bracket credentials are an OR. A single bracket is an AND, which would
# lock out an administrator who does not also hold the other roles.
#
# Nothing here is public. Site coordinates and unpublished excavation records are
# exactly the material that should not be browsable anonymously, and a context
# record can identify the position of a burial.

index:
  is_secure:   true
  credentials: [[ contributor, editor, administrator ]]

sites:
  is_secure:   true
  credentials: [[ contributor, editor, administrator ]]

map:
  is_secure:   true
  credentials: [[ contributor, editor, administrator ]]

site:
  is_secure:   true
  credentials: [[ contributor, editor, administrator ]]

contexts:
  is_secure:   true
  credentials: [[ contributor, editor, administrator ]]

plan:
  is_secure:   true
  credentials: [[ contributor, editor, administrator ]]

context:
  is_secure:   true
  credentials: [[ contributor, editor, administrator ]]

objects:
  is_secure:   true
  credentials: [[ contributor, editor, administrator ]]

object:
  is_secure:   true
  credentials: [[ contributor, editor, administrator ]]

contextsJson:
  is_secure:   true
  credentials: [[ contributor, editor, administrator ]]

objectEdit:
  is_secure:   true
  credentials: [[ editor, administrator ]]

# Writing an excavation record, including its stratigraphic position.
siteEdit:
  is_secure:   true
  credentials: [[ editor, administrator ]]

contextEdit:
  is_secure:   true
  credentials: [[ editor, administrator ]]

# Importing writes contexts and rewrites the sequence.
import:
  is_secure:   true
  credentials: [[ editor, administrator ]]

importTemplate:
  is_secure:   true
  credentials: [[ editor, administrator ]]

contextPdf:
  is_secure:   true
  credentials: [[ contributor, editor, administrator ]]

# Export carries the whole sequence, and for a gated sector the coordinates with
# it, so it is no more public than the pages it exports.
export:
  is_secure:   true
  credentials: [[ contributor, editor, administrator ]]

relationshipStore:
  is_secure:   true
  credentials: [[ editor, administrator ]]

relationshipDelete:
  is_secure:   true
  credentials: [[ editor, administrator ]]

all:
  is_secure:   true
  credentials: [[ contributor, editor, administrator ]]
