# Requesting publication requires an account.
#
# Johan, 2026-08-17: request to publish "should only be available to
# authenticated user", alongside the cart.
#
# THIS is the module the routes use: RouteLoader is constructed with
# 'requestToPublish' (camelCase), and this directory holds all seven actions -
# browse, delete, edit, inbox, receipt, review, submit. The lowercase sibling
# modules/requesttopublish/ is an older partial copy with three of them.
#
# This directory shipped config/module.yml and NO security.yml, so every action
# the site actually serves inherited `default: is_secure: false`. The staff
# queues refused anonymous callers only because they check in code. Putting the
# declaration in the lowercase module, as was done first, protects nothing.
#
# The sibling file previously declared `delete` and `edit` only, with no `all:` entry,
# so every other action inherited `default: is_secure: false` from
# apps/qubit/config/security.yml. The staff queues were protected by in-code
# checks rather than by declaration, which held - but it meant an action added
# without its own guard would have been public, silently.
#
# `all` now closes that. The per-action entries below stay because they add
# credentials on top of authentication.

delete:
  credentials: [[ contributor, editor, administrator ]]
  is_secure: true

edit:
  credentials: [[ contributor, editor, administrator, translator ]]
  is_secure: true

# Everything else, including submit, browse, inbox, review and the receipt
# lookup: signed in, no particular role.
#
# ⚠️ The receipt lookup was previously reachable without an account, so a
# requester could check a request by token alone. That path is now closed. If
# external requesters need it back, give `receipt` its own `is_secure: false`
# entry rather than reopening the module.
all:
  is_secure: true
