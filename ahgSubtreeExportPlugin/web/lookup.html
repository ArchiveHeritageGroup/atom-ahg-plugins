<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Export lookup</title>
<!--
  Reads manifest.js, NOT manifest.json. Browsers refuse fetch() on file://, so a
  page that fetched the JSON would load nothing from a drive - which is the whole
  point of this package. The exporter writes both; the .json is for machines and
  the .js is what this page uses.

  No CDN, no external font, no build step. Everything needed is in this file.
-->
<style>
  :root {
    --gold: #e1b34f; --green: #10373e; --cream: #f2ede6;
    --body: #262626; --muted: #6b7280; --line: #d8d2c8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 Arial, Helvetica, sans-serif; color: var(--body); background: #fff; }
  header { background: var(--green); color: var(--cream); padding: 1rem 1.25rem; }
  header h1 { margin: 0 0 .25rem; font-size: 1.15rem; color: var(--gold); }
  header .meta { font-size: .85rem; opacity: .85; }
  .bar { position: sticky; top: 0; background: var(--cream); border-bottom: 1px solid var(--line);
         padding: .75rem 1.25rem; display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; }
  input[type=search] { flex: 1 1 18rem; min-width: 12rem; padding: .5rem .65rem;
         border: 1px solid var(--line); border-radius: 4px; font-size: 1rem; }
  .count { color: var(--muted); font-size: .9rem; white-space: nowrap; }
  main { padding: 0 1.25rem 3rem; }
  table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
  th, td { text-align: left; padding: .5rem .6rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { background: var(--green); color: #fff; position: sticky; top: 3.6rem; font-size: .85rem; }
  tr:hover td { background: #faf8f5; }
  .slug { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .85rem; }
  .files a { display: block; font-size: .85rem; text-decoration: none; color: #653332; }
  .files a:hover { text-decoration: underline; }
  .tag { display: inline-block; font-size: .7rem; padding: .05rem .35rem; border-radius: 3px;
         background: var(--gold); color: #3a2c08; margin-right: .3rem; }
  .missing, .failed { background: #b00020; color: #fff; }
  .scope { color: var(--muted); font-size: .8rem; margin-top: .2rem; }
  .empty { padding: 2rem 0; color: var(--muted); }
  @media (max-width: 760px) { th:nth-child(3), td:nth-child(3) { display: none; } }
</style>
</head>
<body>
<header>
  <h1 id="title">Export lookup</h1>
  <div class="meta" id="meta"></div>
</header>

<div class="bar">
  <input type="search" id="q" placeholder="Filter by title, identifier, date, creator, shelf, scope note or file name" autocomplete="off" aria-label="Filter records">
  <span class="count" id="count"></span>
</div>

<main>
  <table id="tbl">
    <thead><tr><th>Identifier</th><th>Title</th><th>Details</th><th>Files</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="empty" hidden>No records match that filter.</div>
</main>

<script src="manifest.js"></script>
<script>
(function () {
  var m = window.SUBTREE_MANIFEST;
  if (!m) {
    document.getElementById('meta').textContent =
      'manifest.js is missing or did not load. It must sit beside this file.';
    return;
  }

  var recs = m.records || [];
  var c = m.counts || {};

  document.getElementById('title').textContent =
    'Export lookup: ' + ((m.scope && m.scope.start_slug) || '');
  document.getElementById('meta').textContent =
    [c.records + ' records', c.files + ' files', bytes(c.bytes_written || 0),
     'within ' + ((m.scope && m.scope.bound_slug) || 'unknown'),
     'created ' + (m.created_at || '').slice(0, 10)].join('  |  ');

  function bytes(n) {
    var u = ['B','KB','MB','GB','TB'], i = 0;
    while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
    return n.toFixed(1) + ' ' + u[i];
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (ch) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch];
    });
  }

  // Built once per record and cached: rebuilding it on every keystroke over a
  // thousand records is what makes a filter feel slow.
  function haystack(r) {
    if (r.__hay === undefined) {
      var parts = [r.identifier, r.slug, r.title, r.alternate_title, r.level_of_description,
                   r.repository, r.scope_and_content, r.extent_and_medium,
                   r.physical_characteristics, r.archival_history, r.access_conditions,
                   r.shelf, r.source_standard];
      if (r.creators) { parts = parts.concat(r.creators); }
      if (r.access_points) {
        for (var k in r.access_points) { parts = parts.concat(r.access_points[k]); }
      }
      if (r.dates) { parts = parts.concat(r.dates.map(function (d) { return d.date; })); }
      if (r.files) { parts = parts.concat(r.files.map(function (x) { return x.path; })); }
      r.__hay = parts.join(' ').toLowerCase();
    }
    return r.__hay;
  }

  var rows = document.getElementById('rows');
  var empty = document.getElementById('empty');
  var countEl = document.getElementById('count');

  function render(filter) {
    var f = (filter || '').toLowerCase();
    var html = '', shown = 0;

    for (var i = 0; i < recs.length; i++) {
      var r = recs[i];
      if (f) {
        // Search every descriptive field, not a chosen few. Someone looking for a
        // site will type whatever they remember - a shelf mark, a photographer, a
        // phrase from the scope note - and a search that only covers identifier and
        // slug fails them silently.
        if (haystack(r).indexOf(f) === -1) { continue; }
      }
      shown++;

      var files = (r.files || []).map(function (x) {
        var bad = x.status && x.status !== 'copied';
        // Link straight at the file on the drive. Relative, so it works wherever
        // the package is mounted.
        return '<a href="' + esc(x.path) + '">' +
               '<span class="tag' + (bad ? ' ' + esc(x.status) : '') + '">' +
               esc(bad ? x.status : (x.usage || '')) + '</span>' +
               esc((x.path || '').split('/').pop()) +
               ' <span class="count">' + bytes(x.byte_size || 0) + '</span></a>';
      }).join('');

      var bits = [];
      if (r.level_of_description) { bits.push(esc(r.level_of_description)); }
      if (r.dates && r.dates.length) {
        bits.push(esc(r.dates.map(function (d) { return d.date; }).join(', ')));
      }
      if (r.creators && r.creators.length) { bits.push(esc(r.creators.join(', '))); }
      if (r.repository) { bits.push(esc(r.repository)); }
      if (r.access_points) {
        for (var k in r.access_points) {
          bits.push('<span class="tag">' + esc(k) + '</span>' + esc(r.access_points[k].join(', ')));
        }
      }
      if (r.shelf) { bits.push('shelf ' + esc(r.shelf)); }

      var scope = r.scope_and_content || r.physical_characteristics || '';
      if (scope) {
        scope = '<div class="scope">' + esc(scope.slice(0, 220)) +
                (scope.length > 220 ? '...' : '') + '</div>';
      }

      html += '<tr><td>' + esc(r.identifier) + '<div class="slug">' + esc(r.slug) + '</div></td>' +
              '<td>' + esc(r.title || '') + (r.alternate_title ? '<div class="scope">' + esc(r.alternate_title) + '</div>' : '') + '</td>' +
              '<td>' + bits.join(' &middot; ') + scope + '</td>' +
              '<td class="files">' + files + '</td></tr>';
    }

    rows.innerHTML = html;
    empty.hidden = shown > 0;
    countEl.textContent = shown + ' of ' + recs.length + ' shown';
  }

  var q = document.getElementById('q');
  var t;
  q.addEventListener('input', function () {
    clearTimeout(t);
    // Debounced: a thousand records re-rendered on every keystroke is visibly slow
    // on the sort of machine a reading room actually has.
    t = setTimeout(function () { render(q.value); }, 120);
  });

  render('');
})();
</script>
</body>
</html>
