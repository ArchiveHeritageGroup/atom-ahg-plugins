# The IIIF Authentication API. These endpoints exist to be called by an external
# viewer before it holds any session, so they must stay reachable - that is the
# point of the specification, not an oversight.
#
# Stated explicitly because there was no file here, and an absent security.yml
# and a deliberately public one look identical from the outside.
accessService:  { is_secure: false }
accessToken:    { is_secure: false }
token:          { is_secure: false }
probe:          { is_secure: false }
probePreflight: { is_secure: false }
check:          { is_secure: false }
login:          { is_secure: false }
logout:         { is_secure: false }
confirm:        { is_secure: false }

# Marking an object protected or unprotected changes who may see it.
protect:   { is_secure: true, credentials: [[ editor, administrator ]] }
unprotect: { is_secure: true, credentials: [[ editor, administrator ]] }

# The image server's permission check: Cantaloupe's delegate (config/cantaloupe/
# delegates.rb) calls it for every image, with no AtoM session. It must stay
# reachable without sign-in; the action itself answers only requests from the
# machine it runs on (127.0.0.1, ::1). Securing it made every check return the
# login page, the delegate failed open, and masters were served to anyone
# (found on RARI, 26 Oct 2026).
cantaloupeCheck: { is_secure: false }

all:
  is_secure:   true
  credentials: [[ editor, administrator ]]
