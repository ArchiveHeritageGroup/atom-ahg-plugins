<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mirador viewer</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1a1a1a; }
    #mirador { position: absolute; inset: 0; }
    #msg { color: #ccc; font: 14px system-ui, sans-serif; padding: 1rem; }
  </style>
</head>
<body>
  <!--
    Mirador is mounted in its own document on purpose.

    It is a full React/Material-UI application that expects to own its viewport and
    positions panels absolutely. Dropped straight into an AtoM page it collides with
    the Bootstrap bundle and its panels scatter as dark blocks. OpenSeadragon has no
    such problem - it paints to a canvas and owns a single element - which is why
    viewer plugins should declare HOW they need to be mounted rather than being
    assumed interchangeable.

    Deliberately a static file: ahgMiradorPlugin ships no routes and no PHP, so the
    whole plugin stays a drop-in directory.
  -->
  <div id="mirador"></div>
  <div id="msg" hidden>No manifest supplied.</div>

  <script src="./mirador/mirador.min.js"></script>
  <script>
    (function () {
      'use strict';

      var params = new URLSearchParams(window.location.search);
      var manifest = params.get('manifest');

      if (!manifest) {
        document.getElementById('msg').hidden = false;
        return;
      }

      // Only same-origin manifests, so this page cannot be used to frame arbitrary
      // remote content.
      var url;
      try {
        url = new URL(manifest, window.location.origin);
      } catch (e) {
        document.getElementById('msg').hidden = false;
        return;
      }
      if (url.origin !== window.location.origin) {
        document.getElementById('msg').textContent = 'Manifest must be same-origin.';
        document.getElementById('msg').hidden = false;
        return;
      }

      // Defaults, restored from the implementation this plugin replaced
      // (ahgIiifPlugin/web/public/mirador/viewer.html and embed.js). Four of these
      // survived the split; the rest did not, and their absence is visible:
      // without allowClose the reader can close the window into an empty grey
      // workspace with no way back except a reload.
      var config = {
        id: 'mirador',
        windows: [{
          manifestId: url.href,
          thumbnailNavigationPosition: 'far-bottom'
        }],
        window: {
          allowClose: false,
          allowMaximize: true,
          allowFullscreen: true,
          sideBarOpenByDefault: false
        },
        workspace: {
          type: 'single',
          showZoomControls: true
        },
        workspaceControlPanel: {
          enabled: false
        },
        thumbnailNavigation: {
          defaultPosition: 'far-bottom'
        }
      };

      // Interface language, passed by the renderer from AtoM's culture.
      //
      // Mirador ships translations and we never selected one, so a reader on an
      // Afrikaans or isiZulu interface got an English viewer. Only a language tag
      // is accepted - anything else is ignored rather than handed to Mirador.
      var lang = params.get('lang');
      if (lang && /^[a-z]{2,3}(-[A-Za-z0-9]{2,8})?$/.test(lang)) {
        config.language = lang;
      }

      // Caller overrides.
      //
      // Restricted to an allowlist. This page is reachable by URL, so anything
      // read from the query string is attacker-controlled; merging arbitrary
      // Mirador configuration from it would be a hole, not a feature.
      var ALLOWED = [
        'window', 'workspace', 'workspaceControlPanel', 'thumbnailNavigation',
        'osdConfig', 'theme', 'galleryView', 'export'
      ];

      var opts = params.get('opts');
      if (opts) {
        try {
          var parsed = JSON.parse(opts);
          Object.keys(parsed).forEach(function (k) {
            if (ALLOWED.indexOf(k) === -1) { return; }
            if (parsed[k] && typeof parsed[k] === 'object' && config[k]) {
              Object.assign(config[k], parsed[k]);
            } else {
              config[k] = parsed[k];
            }
          });
        } catch (e) {
          // A malformed override must not cost the reader the viewer.
        }
      }

      Mirador.viewer(config);
    })();
  </script>
</body>
</html>
